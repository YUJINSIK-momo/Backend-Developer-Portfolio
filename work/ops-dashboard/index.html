    <script type="text/javascript">
      // GitHub Pages SPA: 404.html이 ?p=/route로 변환한 URL을
      // 다시 원래 경로로 복원해서 React Router가 처리할 수 있게 함.
      (function (l) {
        if (l.search[1] === "p") {
          var q = {}
          l.search.slice(1).split("&").forEach(function (v) {
            var a = v.split("=")
            q[a[0]] = a.slice(1).join("=").replace(/~and~/g, "&")
          })
          if (q.p !== undefined) {
            window.history.replaceState(null, "",
              l.pathname.slice(0, -1) + (q.p || "") +
              (q.q ? "?" + q.q : "") +
              l.hash
            )
          }
        }
      }(window.location))
    </script>
